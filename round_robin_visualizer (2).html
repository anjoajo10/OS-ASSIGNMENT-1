<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDG-Based Round Robin Scheduling - Interactive Visualizer</title>
<style>
  :root{--bg:#070b18;--ink:#e2e8f0;--mute:#94a3b8;--glass:rgba(255,255,255,.055);--edge:rgba(255,255,255,.12);
        --cyan:#38bdf8;--violet:#a78bfa;--pink:#f472b6;--mint:#34d399}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;
    background:
      radial-gradient(900px 500px at 8% -5%,rgba(56,189,248,.22),transparent 60%),
      radial-gradient(800px 500px at 95% 0%,rgba(167,139,250,.24),transparent 60%),
      radial-gradient(900px 600px at 50% 110%,rgba(244,114,182,.14),transparent 60%),
      var(--bg);background-attachment:fixed}
  header{padding:30px 24px 10px;text-align:center}
  header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(90deg,#7dd3fc,#c4b5fd 50%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:8px 0 10px;font-size:14px;color:var(--mute)}
  .sdg{display:inline-block;margin:3px;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#0b1020}
  main{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .tab{border:1px solid var(--edge);background:var(--glass);padding:10px 20px;border-radius:30px;cursor:pointer;
    font-weight:600;color:var(--mute);backdrop-filter:blur(8px);transition:.2s}
  .tab:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .tab.active{color:#0b1020;border-color:transparent;background:linear-gradient(90deg,#38bdf8,#a78bfa);box-shadow:0 0 22px rgba(125,140,250,.5)}
  .panel{display:none;background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:20px;
    backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .panel.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
  label{color:var(--mute);font-size:14px}
  select,button{font:inherit}
  select{padding:9px 12px;border:1px solid var(--edge);border-radius:10px;background:#111a33;color:var(--ink);outline:none}
  select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,189,248,.25)}
  input[type=range]{accent-color:#a78bfa;vertical-align:middle}
  .btn{border:0;border-radius:12px;padding:10px 18px;color:#0b1020;font-weight:700;cursor:pointer;transition:.18s;
    box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .b-play{background:linear-gradient(135deg,#34d399,#10b981);box-shadow:0 0 18px rgba(52,211,153,.4)}
  .b-pause{background:linear-gradient(135deg,#fcd34d,#f59e0b)}
  .b-step{background:linear-gradient(135deg,#7dd3fc,#38bdf8)}
  .b-reset{background:linear-gradient(135deg,#fda4af,#fb7185)}
  .b-dl{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}
  .b-dl2{background:linear-gradient(135deg,#c4b5fd,#a78bfa);box-shadow:0 0 18px rgba(167,139,250,.4)}
  .bar{height:8px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin:4px 0 14px}
  .bar>div{height:100%;width:0;border-radius:8px;transition:width .2s;
    background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);box-shadow:0 0 12px rgba(167,139,250,.7)}
  .banner{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,139,250,.12));border:1px solid rgba(125,140,250,.45);
    border-radius:14px;padding:14px 18px;margin-bottom:14px}
  .time{font-size:26px;font-weight:800;color:#fff;text-shadow:0 0 18px rgba(125,211,252,.6)}
  .time small{font-size:13px;color:var(--mute);font-weight:400;text-shadow:none}
  .chip{display:inline-block;color:#0b1020;border-radius:14px;padding:2px 12px;margin:1px 4px 1px 0;font-weight:800;
    box-shadow:0 0 12px currentColor}
  .note{margin-top:10px;padding:9px 12px;background:rgba(0,0,0,.28);border-left:4px solid #fbbf24;border-radius:8px;color:#e2e8f0}
  canvas{width:100%;max-width:1100px;height:auto;display:block;border:1px solid var(--edge);border-radius:14px;
    box-shadow:0 0 30px rgba(99,102,241,.2)}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .card{border-radius:14px;padding:12px 16px}
  .live{background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.4)}
  .final{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.55);box-shadow:0 0 24px rgba(52,211,153,.18)}
  .locked{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.22);color:var(--mute)}
  table{border-collapse:collapse;font-size:13px;margin:8px 0;border-radius:10px;overflow:hidden}
  th{background:linear-gradient(90deg,#1e2a52,#2b2461);color:#c7d2fe;padding:7px 12px;font-weight:700}
  td{padding:7px 12px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);color:#e2e8f0}
  tr:hover td{background:rgba(255,255,255,.04)}
  h3{color:#c4b5fd;margin:18px 0 4px}
  hr{border:0;border-top:1px solid var(--edge);margin:18px 0}
  li{margin:4px 0;color:#cbd5e1}
  .status{color:var(--mute);font-size:13px;margin-top:8px}
  .trade{font-style:italic;color:#a5b4fc;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;padding:10px 14px;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>SDG-Based Round Robin Scheduling - Interactive Visualizer</h1>
  <p>Watch the CPU decide, millisecond by millisecond.</p>
  <span class="sdg" style="background:#38bdf8">SDG 6 Clean Water</span><span class="sdg" style="background:#fbbf24">SDG 11 Sustainable Cities</span><span class="sdg" style="background:#34d399">SDG 12 Responsible Consumption</span><span class="sdg" style="background:#f472b6">SDG 13 Climate Action</span>
</header>
<main>
  <div class="tabs">
    <button class="tab active" data-tab="live">Live Simulator</button>
    <button class="tab" data-tab="finals">Final Gantt Charts</button>
    <button class="tab" data-tab="compare">Comparison &amp; Conclusion</button>
  </div>

  <section id="live" class="panel active">
    <div class="row">
      <label>Activity: <select id="actSel"></select></label>
      <label>Quantum (ms): <select id="qSel"></select></label>
      <label>Speed: <input type="range" id="speed" min="0.5" max="8" step="0.5" value="1.5">
        <b id="speedVal">1.5</b> steps/s</label>
    </div>
    <div class="row">
      <button class="btn b-step" id="prevBtn">&#9198; Previous</button>
      <button class="btn b-play" id="playBtn">&#9654; Start / Play</button>
      <button class="btn b-pause" id="pauseBtn">&#9208; Pause</button>
      <button class="btn b-step" id="nextBtn">Next Step &#9197;</button>
      <button class="btn b-reset" id="resetBtn">&#8635; Reset</button>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <div class="banner" id="banner"></div>
    <canvas id="gantt"></canvas>
    <div class="grid">
      <div class="card live" id="liveTable"></div>
      <div class="card live" id="liveStats"></div>
    </div>
    <div class="card" id="finalBox" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn b-dl" id="dlCur">&#11015; Download this Gantt chart (PNG)</button>
      <button class="btn b-dl2" id="dlAll">&#11015; Download ALL charts + tables</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section id="finals" class="panel"></section>
  <section id="compare" class="panel"></section>
</main>

<script>
// =====================================================================
// 1. INPUT DATA (from the assignment)
// =====================================================================
const ACT = {
  A1: { title: "Activity 1 - Municipal Services (SDG 6, 11, 12)", cs: 0, quanta: [2, 3],
        procs: [["P1","Water-quality monitoring",0,5],["P2","Waste-collection scheduling",1,3],
                ["P3","Traffic-pollution analysis",2,4],["P4","Public energy-use monitoring",3,2]] },
  A2: { title: "Activity 2 - Climate Emergency Services (SDG 11, 13)", cs: 1, quanta: [2, 4],
        procs: [["P1","Flood-warning analysis",0,5],["P2","Air-quality alert generation",1,4],
                ["P3","Emergency evacuation route update",2,3],["P4","Renewable-grid status monitoring",3,2]] }
};
const PCOL = { P1: "#38bdf8", P2: "#fbbf24", P3: "#34d399", P4: "#c084fc" };
const CS_COL = "#fb7185";

//==ENGINE START
// =====================================================================
// 2. ROUND ROBIN ENGINE - records a snapshot after EVERY millisecond
// =====================================================================
function simulate(procsIn, q, cs) {
  const procs = procsIn.slice().sort((a, b) => a[2] - b[2] || (a[0] < b[0] ? -1 : 1));
  const n = procs.length;
  const rem = {};  procs.forEach(p => rem[p[0]] = p[3]);
  let t = 0, nxt = 0, last = null, switches = 0, busy = 0, csMs = 0;
  const queue = [], arrived = [], completed = [], firstStart = {}, ct = {};
  const slots = [], snaps = [];

  // move every process that has arrived by time t into the FIFO ready queue
  function admit(ev) {
    while (nxt < n && procs[nxt][2] <= t) {
      const pid = procs[nxt][0];
      queue.push(pid); arrived.push(pid);
      ev.push(pid + " arrives and joins the ready queue.");
      nxt++;
    }
  }
  function snap(kind, running, dispatching, note) {
    snaps.push({ time: t, kind, running, dispatching, queue: queue.slice(), rem: Object.assign({}, rem),
      arrived: arrived.slice(), completed: completed.slice(), firstStart: Object.assign({}, firstStart),
      switches, busy, csMs, note });
  }

  let ev = []; admit(ev);
  snap("start", null, null, "Simulation ready at t = 0 ms. " + ev.join(" ") + " Press Play or Next Step to begin.");

  while (completed.length < n) {
    if (queue.length === 0) {                       // CPU idle
      t++; slots.push(["IDLE", null]);
      ev = []; admit(ev);
      snap("IDLE", null, null, (t-1) + "->" + t + " ms: CPU is idle, no process is ready. " + ev.join(" "));
      continue;
    }
    const pid = queue.shift();                      // FIFO: front runs next
    const continued = (pid === last);
    let ctxNo = null;

    // context switch only when the CPU changes to a DIFFERENT process
    if (last !== null && pid !== last) {
      switches++; ctxNo = switches;
      for (let i = 0; i < cs; i++) {
        t++; csMs++; slots.push(["CS", null]);
        ev = []; admit(ev);
        snap("CS", null, pid, (t-1) + "->" + t + " ms: CONTEXT SWITCH #" + ctxNo + " (" + (i+1) + "/" + cs +
          " ms) - the CPU is saving " + last + " and loading " + pid + ". No useful work is done. " + ev.join(" "));
      }
    }

    // run for up to one quantum
    const run = Math.min(q, rem[pid]);
    for (let i = 0; i < run; i++) {
      if (!(pid in firstStart)) firstStart[pid] = t;
      t++; rem[pid]--; busy++; slots.push(["P", pid]);
      ev = []; admit(ev);                           // arrivals first ...
      let msg = (t-1) + "->" + t + " ms: " + pid + " executes (slice " + (i+1) + "/" + q +
                "); remaining burst = " + rem[pid] + " ms.";
      if (i === 0 && ctxNo && cs === 0) msg += " Context switch #" + ctxNo + ": " + last + " -> " + pid + " (0 ms overhead).";
      if (i === 0 && continued) msg += " " + pid + " is the only ready process, so it continues (no context switch).";
      if (rem[pid] === 0) { completed.push(pid); ct[pid] = t; msg += " " + pid + " FINISHES at t = " + t + " ms."; }
      else if (i === run - 1) { queue.push(pid); msg += " Quantum of " + q + " ms is over, so " + pid + " goes to the back of the ready queue."; }
      snap("P", pid, null, msg + " " + ev.join(" "));   // ... then the unfinished process
    }
    last = pid;
  }

  // performance metrics
  const rows = procs.map(([pid, task, a, b]) => {
    const tat = ct[pid] - a;
    return { Process: pid, Task: task, AT: a, BT: b, "First Start": firstStart[pid],
             CT: ct[pid], TAT: tat, WT: tat - b, RT: firstStart[pid] - a };
  });
  const avg = k => Math.round(rows.reduce((s, r) => s + r[k], 0) / rows.length * 100) / 100;
  const totalBurst = rows.reduce((s, r) => s + r.BT, 0);
  const summary = {
    "Avg TAT (ms)": avg("TAT"), "Avg WT (ms)": avg("WT"), "Avg RT (ms)": avg("RT"),
    "Context switches": switches, "Total CS overhead (ms)": switches * cs,
    "Total elapsed time (ms)": t, "CPU efficiency (%)": Math.round(totalBurst / t * 10000) / 100
  };
  return { procs, q, cs, slots, snaps, T: t, metrics: rows, summary };
}
//==ENGINE END

// pre-compute all four required runs
const RESULTS = {};
for (const key in ACT) for (const q of ACT[key].quanta) RESULTS[key + "_" + q] = simulate(ACT[key].procs, q, ACT[key].cs);

// =====================================================================
// 3. GANTT CHART on a <canvas> (draws only slots up to time `upto`)
// =====================================================================
function drawGantt(canvas, res, upto, title) {
  const W = 1100, H = 300, dpr = 2;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const c = canvas.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = c.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#0d1428"); bg.addColorStop(1, "#171236");
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const x0 = 70, x1 = W - 25, T = res.T, u = (x1 - x0) / T, top = 95, bh = 100;

  c.fillStyle = "#f1f5f9"; c.font = "bold 16px Segoe UI, Arial"; c.textAlign = "left";
  c.fillText(title, 20, 26);
  for (let i = 0; i < T; i++) { c.fillStyle = "rgba(255,255,255,.045)"; c.fillRect(x0 + i * u, top, u, bh); c.strokeStyle = "rgba(255,255,255,.08)"; c.lineWidth = 1; c.strokeRect(x0 + i * u, top, u, bh); }

  res.slots.slice(0, upto).forEach(([kind, pid], i) => {          // one box per millisecond
    const x = x0 + i * u;
    c.fillStyle = kind === "P" ? PCOL[pid] : kind === "CS" ? CS_COL : "#334155";
    c.save(); if (kind === "P") { c.shadowColor = PCOL[pid]; c.shadowBlur = 12; } c.fillRect(x, top, u, bh); c.restore();
    if (kind === "CS") {                                          // hatch lines for context switch
      c.save(); c.beginPath(); c.rect(x, top, u, bh); c.clip();
      c.strokeStyle = "rgba(15,23,42,.45)"; c.lineWidth = 1.5;
      for (let d = -bh; d < u + bh; d += 9) { c.beginPath(); c.moveTo(x + d, top + bh); c.lineTo(x + d + bh, top); c.stroke(); }
      c.restore();
    }
    c.strokeStyle = "#0b1020"; c.lineWidth = 2; c.strokeRect(x, top, u, bh);
  });

  const s = res.slots.slice(0, upto);                              // labels (merge equal neighbours)
  c.textAlign = "center"; c.textBaseline = "middle";
  for (let i = 0; i < s.length;) {
    let j = i; while (j + 1 < s.length && s[j+1][0] === s[i][0] && s[j+1][1] === s[i][1]) j++;
    const cx = x0 + (i + j + 1) / 2 * u, cy = top + bh / 2;
    if (s[i][0] === "P") { c.fillStyle = "#0b1020"; c.font = "bold 18px Segoe UI, Arial"; c.fillText(s[i][1], cx, cy); }
    else if (s[i][0] === "CS") {
      c.fillStyle = "#0b1020"; c.fillRect(cx - 13, cy - 10, 26, 20);
      c.fillStyle = "#fda4af"; c.font = "bold 12px Segoe UI, Arial"; c.fillText("CS", cx, cy);
    } else { c.fillStyle = "#94a3b8"; c.font = "12px Segoe UI, Arial"; c.fillText("idle", cx, cy); }
    i = j + 1;
  }

  c.textBaseline = "alphabetic";
  c.font = "11px Segoe UI, Arial"; c.fillStyle = "#94a3b8"; c.textAlign = "right";
  c.fillText("arrivals", x0 - 14, 76);
  res.procs.forEach(([pid, , a]) => {                              // arrival markers
    if (a > upto) return;
    const x = x0 + a * u;
    c.fillStyle = PCOL[pid]; c.beginPath(); c.moveTo(x - 7, 66); c.lineTo(x + 7, 66); c.lineTo(x, 82); c.fill();
    c.font = "bold 12px Segoe UI, Arial"; c.textAlign = "center"; c.fillText(pid, x, 60);
  });

  c.fillStyle = "#cbd5e1"; c.font = "12px Segoe UI, Arial"; c.textAlign = "center";   // time axis
  c.strokeStyle = "#64748b"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, top + bh); c.lineTo(x1, top + bh); c.stroke();
  for (let i = 0; i <= T; i++) {
    const x = x0 + i * u;
    c.beginPath(); c.moveTo(x, top + bh); c.lineTo(x, top + bh + 5); c.stroke();
    c.fillText(i, x, top + bh + 20);
  }
  c.fillText("Time (ms)", (x0 + x1) / 2, top + bh + 42);

  const cx = x0 + upto * u;                                        // current-time cursor
  c.save(); c.shadowColor = "#ffffff"; c.shadowBlur = 10; c.strokeStyle = "#f8fafc"; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(cx, top - 8); c.lineTo(cx, top + bh + 6); c.stroke(); c.restore();
  c.fillStyle = "#f8fafc"; c.font = "bold 12px Segoe UI, Arial"; c.fillText("t = " + upto, cx, top + bh + 58);

  const items = res.procs.map(p => [p[0], PCOL[p[0]]]);            // legend
  if (res.cs > 0) items.push(["CS (context switch)", CS_COL]);
  let lx = W / 2 - items.length * 55; c.textAlign = "left";
  items.forEach(([name, col]) => {
    c.fillStyle = col; c.fillRect(lx, 280, 14, 14);
    c.fillStyle = "#cbd5e1"; c.font = "12px Segoe UI, Arial"; c.fillText(name, lx + 19, 292);
    lx += 19 + c.measureText(name).width + 22;
  });
}
const ganttTitle = (res, key) => ACT[key].title + "  |  Quantum = " + res.q + " ms  |  CS overhead = " + res.cs + " ms";

// =====================================================================
// 4. HTML HELPERS
// =====================================================================
const chip = pid => '<span class="chip" style="background:' + PCOL[pid] + '">' + pid + '</span>';
function tableHTML(rows, cols) {
  cols = cols || Object.keys(rows[0]);
  return "<table><tr>" + cols.map(c => "<th>" + c + "</th>").join("") + "</tr>" +
    rows.map(r => "<tr>" + cols.map(c => "<td>" + r[c] + "</td>").join("") + "</tr>").join("") + "</table>";
}
function bannerHTML(res, sn) {
  let cpu;
  if (sn.kind === "P") cpu = chip(sn.running) + " is RUNNING";
  else if (sn.kind === "CS") cpu = '<span class="chip" style="background:' + CS_COL + '">CS</span> CPU is performing a CONTEXT SWITCH (next: ' + chip(sn.dispatching) + ")";
  else if (sn.kind === "IDLE") cpu = "CPU is idle";
  else cpu = "CPU not started yet";
  const list = a => a.map(chip).join(" ") || "<i>none</i>";
  return '<div class="time">&#9201; Current time: ' + sn.time + ' ms <small>of ' + res.T + ' ms</small></div>' +
    '<div style="margin-top:6px"><b>CPU:</b> ' + cpu + '</div>' +
    '<div style="margin-top:4px"><b>Ready queue</b> (front &rarr; back): ' + (sn.queue.map(chip).join(" &rarr; ") || "<i>(empty)</i>") + '</div>' +
    '<div style="margin-top:4px"><b>Arrived so far:</b> ' + list(sn.arrived) + ' &nbsp; <b>Completed:</b> ' + list(sn.completed) + '</div>' +
    '<div class="note"><b>What happens now:</b> ' + sn.note + '</div>';
}
function liveTableHTML(res, sn) {
  const rows = res.procs.map(([pid, , a, b]) => {
    const r = sn.rem[pid];
    let st;
    if (sn.completed.includes(pid)) st = '<b style="color:#34d399">Completed</b>';
    else if (sn.running === pid) st = '<b style="color:#38bdf8">Running</b>';
    else if (sn.dispatching === pid) st = '<b style="color:#fb7185">Being loaded (CS)</b>';
    else if (sn.arrived.includes(pid)) st = '<span style="color:#fbbf24">Ready (waiting)</span>';
    else st = '<span style="color:#64748b">Not arrived</span>';
    return { Process: pid, AT: a, BT: b, Status: st, Remaining: r,
             "First start": pid in sn.firstStart ? sn.firstStart[pid] : "-",
             "Waiting so far": sn.arrived.includes(pid) ? (sn.time - a) - (b - r) : "-" };
  });
  return '<b style="color:#7dd3fc">&#128309; LIVE values (change every step)</b>' + tableHTML(rows);
}
function liveStatsHTML(res, sn) {
  const eff = sn.time > 0 ? (sn.busy / sn.time * 100).toFixed(1) + " %" : "-";
  return '<b style="color:#7dd3fc">&#128309; LIVE counters</b><table>' +
    "<tr><td>CPU busy so far</td><td><b>" + sn.busy + " ms</b></td></tr>" +
    "<tr><td>Context switches so far</td><td><b>" + sn.switches + "</b></td></tr>" +
    "<tr><td>CS overhead so far</td><td><b>" + sn.csMs + " ms</b></td></tr>" +
    "<tr><td>CPU efficiency so far</td><td><b>" + eff + "</b></td></tr>" +
    "<tr><td>Completed</td><td><b>" + sn.completed.length + " / " + res.procs.length + "</b></td></tr></table>";
}
function finalHTML(res) {
  const cols = ["Process", "AT", "BT", "First Start", "CT", "TAT", "WT", "RT"];
  return '<b style="color:#6ee7b7">&#9989; FINAL results (simulation finished)</b>' + tableHTML(res.metrics, cols) +
    "<table>" + Object.entries(res.summary).map(([k, v]) => "<tr><td>" + k + "</td><td><b>" + v + "</b></td></tr>").join("") + "</table>";
}

// =====================================================================
// 5. COMPARISON TABLES + CONCLUSION
// =====================================================================
const LOWER_BETTER = { "Avg TAT (ms)": true, "Avg WT (ms)": true, "Avg RT (ms)": true, "Context switches": true,
  "Total CS overhead (ms)": true, "Total elapsed time (ms)": true, "CPU efficiency (%)": false };
function comparisonRows(ra, rb) {
  return Object.keys(LOWER_BETTER).map(k => {
    const a = ra.summary[k], b = rb.summary[k];
    const better = a === b ? "Same" : ((a < b) === LOWER_BETTER[k] ? "Q = " + ra.q : "Q = " + rb.q);
    const row = { Metric: k }; row["Q = " + ra.q + " ms"] = a; row["Q = " + rb.q + " ms"] = b; row.Better = better;
    return row;
  });
}
function conclusionLines(key) {
  const [qa, qb] = ACT[key].quanta, ra = RESULTS[key + "_" + qa], rb = RESULTS[key + "_" + qb];
  const out = [], sa = ra.summary, sb = rb.summary;
  const pick = (k) => sa[k] < sb[k] ? [ra, rb] : [rb, ra];
  if (sa["Avg RT (ms)"] !== sb["Avg RT (ms)"]) { const [lo, hi] = pick("Avg RT (ms)");
    out.push("Response time: Q = " + lo.q + " ms is faster (average RT " + lo.summary["Avg RT (ms)"] + " ms vs " + hi.summary["Avg RT (ms)"] + " ms), because every process gets its first turn sooner."); }
  if (sa["Context switches"] !== sb["Context switches"]) { const [lo, hi] = pick("Context switches");
    let extra = ACT[key].cs > 0 ? " The overhead is " + lo.summary["Total CS overhead (ms)"] + " ms vs " + hi.summary["Total CS overhead (ms)"] +
      " ms and CPU efficiency is " + lo.summary["CPU efficiency (%)"] + " % vs " + hi.summary["CPU efficiency (%)"] + " %." : "";
    out.push("Switching: Q = " + lo.q + " ms needs fewer context switches (" + lo.summary["Context switches"] + " vs " + hi.summary["Context switches"] + ")." + extra); }
  if (sa["Avg WT (ms)"] !== sb["Avg WT (ms)"]) { const [lo, hi] = pick("Avg WT (ms)");
    out.push("Waiting/turnaround: Q = " + lo.q + " ms is better (average WT " + lo.summary["Avg WT (ms)"] + " ms vs " + hi.summary["Avg WT (ms)"] +
      " ms; average TAT " + lo.summary["Avg TAT (ms)"] + " ms vs " + hi.summary["Avg TAT (ms)"] + " ms)."); }
  return out;
}
const TRADE_OFF = {
  A1: "Trade-off: a small quantum gives every service a turn quickly (fair CPU access, short response time) but causes more context switches. A larger quantum cuts the number of switches but makes later-arriving tasks wait longer for their first turn. Choose the quantum that gives the best balance of fairness (RT), waiting time and switches.",
  A2: "Trade-off: every extra context switch costs 1 ms of pure overhead, so a larger quantum lowers overhead and raises CPU efficiency. But a larger quantum also makes urgent tasks wait longer before they start, which is risky for emergency alerts. Choose the quantum that reduces overhead while keeping response time acceptable for emergency services."
};

// =====================================================================
// 6. DOWNLOAD HELPERS
// =====================================================================
function saveBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function toCSV(rows) {
  const cols = Object.keys(rows[0]);
  return [cols.join(",")].concat(rows.map(r => cols.map(c => '"' + String(r[c]).replace(/"/g, '""') + '"').join(","))).join("\n");
}
function downloadGantt(key, q) {                       // always saves the COMPLETE chart
  const res = RESULTS[key + "_" + q], cv = document.createElement("canvas");
  drawGantt(cv, res, res.T, ganttTitle(res, key));
  cv.toBlob(b => saveBlob(b, key + "_Q" + q + "_gantt.png"));
}
function downloadAll() {
  const jobs = [];
  for (const key in ACT) {
    for (const q of ACT[key].quanta) {
      jobs.push(() => downloadGantt(key, q));
      jobs.push(() => saveBlob(new Blob([toCSV(RESULTS[key + "_" + q].metrics)], { type: "text/csv" }), key + "_Q" + q + "_metrics.csv"));
    }
    const [qa, qb] = ACT[key].quanta;
    jobs.push(() => saveBlob(new Blob([toCSV(comparisonRows(RESULTS[key + "_" + qa], RESULTS[key + "_" + qb]))], { type: "text/csv" }), key + "_comparison_Q" + qa + "_vs_Q" + qb + ".csv"));
  }
  jobs.forEach((j, i) => setTimeout(j, i * 350));
  setStatus("Downloading " + jobs.length + " files (allow multiple downloads if your browser asks).");
}

// =====================================================================
// 7. THE INTERACTIVE VISUALIZER
// =====================================================================
const $ = id => document.getElementById(id);
const state = { key: "A1", q: 2, res: RESULTS["A1_2"], k: 0, timer: null };

function setStatus(m) { $("status").textContent = m; }
function refresh() {                                    // redraw every panel for step k
  const res = state.res, sn = res.snaps[state.k], done = state.k >= res.T;
  $("banner").innerHTML = bannerHTML(res, sn);
  drawGantt($("gantt"), res, state.k, ganttTitle(res, state.key));
  $("liveTable").innerHTML = liveTableHTML(res, sn);
  $("liveStats").innerHTML = liveStatsHTML(res, sn);
  const fb = $("finalBox");
  fb.className = "card " + (done ? "final" : "locked");
  fb.innerHTML = done ? finalHTML(res) : "<b>&#128274; FINAL results</b> will appear here when the simulation reaches t = " + res.T + " ms.";
  $("progress").style.width = (state.k / res.T * 100) + "%";
  $("prevBtn").disabled = state.k === 0;
  $("nextBtn").disabled = done;
  setButtons();
}
function setButtons() {
  const playing = state.timer !== null;
  $("playBtn").disabled = playing;
  $("pauseBtn").disabled = !playing;
}
function stopPlaying() {                                // only ever one timer; always cleared here
  if (state.timer !== null) { clearTimeout(state.timer); state.timer = null; }
  setButtons();
}
function tick() {                                       // advances exactly ONE simulated millisecond
  if (state.k < state.res.T) state.k++;
  refresh();
  if (state.k >= state.res.T) { stopPlaying(); return; }
  state.timer = setTimeout(tick, 1000 / parseFloat($("speed").value));
}
function play() {
  if (state.timer !== null) return;                     // already playing -> ignore (no overlap)
  if (state.k >= state.res.T) { state.k = 0; refresh(); }
  state.timer = setTimeout(tick, 1000 / parseFloat($("speed").value));
  setButtons();
}
function step(d) {
  stopPlaying();
  state.k = Math.min(state.res.T, Math.max(0, state.k + d));
  refresh();
}
function loadConfig() {                                 // activity / quantum changed -> back to t = 0
  stopPlaying();
  state.key = $("actSel").value; state.q = parseInt($("qSel").value, 10);
  state.res = RESULTS[state.key + "_" + state.q]; state.k = 0;
  refresh();
}
function fillQuanta() {
  $("qSel").innerHTML = ACT[$("actSel").value].quanta.map(q => '<option value="' + q + '">' + q + "</option>").join("");
}

// ---- build the page ----
$("actSel").innerHTML = Object.keys(ACT).map(k => '<option value="' + k + '">' + ACT[k].title + "</option>").join("");
fillQuanta();
$("actSel").onchange = () => { fillQuanta(); loadConfig(); };
$("qSel").onchange = loadConfig;
$("playBtn").onclick = play;
$("pauseBtn").onclick = () => stopPlaying();
$("nextBtn").onclick = () => step(1);
$("prevBtn").onclick = () => step(-1);
$("resetBtn").onclick = () => { stopPlaying(); state.k = 0; refresh(); };
$("speed").oninput = () => { $("speedVal").textContent = $("speed").value; };   // new speed applies from the next step
$("dlCur").onclick = () => { downloadGantt(state.key, state.q); setStatus("Downloading the complete Gantt chart for this run."); };
$("dlAll").onclick = downloadAll;

// tab 2: four final Gantt charts
(function () {
  let html = "";
  for (const key in ACT) for (const q of ACT[key].quanta) {
    const res = RESULTS[key + "_" + q];
    html += '<canvas id="fin_' + key + '_' + q + '"></canvas>' +
      tableHTML(res.metrics, ["Process", "AT", "BT", "First Start", "CT", "TAT", "WT", "RT"]) +
      "<table>" + Object.entries(res.summary).map(([k, v]) => "<tr><td>" + k + "</td><td><b>" + v + "</b></td></tr>").join("") + "</table><hr>";
  }
  $("finals").innerHTML = html;
  for (const key in ACT) for (const q of ACT[key].quanta) {
    const res = RESULTS[key + "_" + q];
    drawGantt($("fin_" + key + "_" + q), res, res.T, ganttTitle(res, key));
  }
})();

// tab 3: comparison tables + conclusions
(function () {
  let html = "";
  for (const key in ACT) {
    const [qa, qb] = ACT[key].quanta;
    html += "<h3>" + ACT[key].title + ": Quantum " + qa + " vs Quantum " + qb + "</h3>" +
      tableHTML(comparisonRows(RESULTS[key + "_" + qa], RESULTS[key + "_" + qb])) +
      "<ul>" + conclusionLines(key).map(l => "<li>" + l + "</li>").join("") + "</ul>" +
      '<p class="trade">' + TRADE_OFF[key] + "</p><hr>";
  }
  $("compare").innerHTML = html;
})();

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === b.dataset.tab));
});

refresh();
</script>
</body>
</html>
